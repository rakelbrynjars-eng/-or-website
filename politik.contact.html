    <main class="contact-page">
        <h1>Contact</h1>
        <div class="contact-columns">
            <section class="contact-card">
                <h2>Get in contact</h2>
                <p>Have a question for Þór? Get in touch by email.</p>

                <a href="mailto:thor@seltjarnarnes.is">thor@seltjarnarnes.is</a>
            </section>

            <section class="contact-card">
                <h2>Send an enquiry</h2>
            
                <form action="mailto:thor@seltjarnarnes.is"method="post"enctype="text/plain">
                    
                <label for="contact-name">Name</label>
                <input id="contact-name" name="name"
                    type="text" required>
                    
                <label for="contact-email">Email</label>
                <input id="contact-email" name="email"
                    type="email" required>
                    
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message"
                    rows="5" required></textarea>
                    
                <button type="submit">Send enquiry</button>
            </form>
        </section>
    </div>
